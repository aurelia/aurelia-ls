<template>
  <output id="message-value">${message}</output>
  <button id="toggle" click.trigger="active = !active">Toggle</button>
  <button id="append" click.trigger="append()">Append</button>
  <output id="selected-value">${selected.join(',')}</output>
  <native-probe data-native="root"><i></i></native-probe>
  <native-probe data-native="conditional" if.bind="active"><i></i></native-probe>
  <native-probe data-native="repeat" repeat.for="item of items"><i></i></native-probe>
  <template repeat.for="item of items"><native-probe data-native="retained-repeat"><i></i></native-probe></template>
  <template id="native-retained"><native-probe data-native="retained"><i></i></native-probe></template>
  <form id="native-range-state">
    <input id="range-minmax" data-range="minmax" type="range" min="80" max="100">
    <input id="range-step" data-range="step" type="range" step="10" min="3" max="90">
    <input data-range="explicit" type="range" min="80" max="100" value="84">
    <input data-range="type-last" min="80" max="100" type="range">
    <div if.bind="active"><input data-range="conditional" type="range" min="80" max="100"></div>
    <div repeat.for="item of items"><input data-range="repeat" type="range" step="10" min="3" max="90"></div>
  </form>
  <attribute-lab id="lab">
    <button data-native="is-remove" data-case="is-remove" is="native-button"><i></i></button>
    <button data-native="is-rewrite" data-case="is-rewrite" is="native-button"><i></i></button>
    <button data-native="is-add" data-case="is-add"><i></i></button>
    <div id="order-case" data-case="order" data-first="first" data-remove="remove" data-second="second">order</div>
    <input id="generated-input" data-case="input" value="authored-static" title.bind="discarded" placeholder.bind="discarded">
    <p id="attribute-case" data-case="attribute">stamped</p>
    <div id="element-case" data-case="element"></div>
    <p id="conditional-case" data-case="conditional">conditional:${message}</p>
    <p class="generated-row" data-case="repeat">${item}:${message}</p>
    <select id="generated-select" data-case="select"><option value="a">A</option><option value="b">B</option></select>
    <div id="classes-case" data-case="classes" class="authored">classes</div>
    <svg id="svg-case" data-case="svg" viewBox="0 0 20 20" xmlns:xlink="http://www.w3.org/1999/xlink"><a id="svg-link" class="base old old" xlink:href="#old"><text>vector</text></a></svg>
  </attribute-lab>
  <attribute-card class="native-repeat-card" repeat.for="item of items" label.bind="item"></attribute-card>
  <projection-lab>
    <native-probe data-native="projection" au-slot="first"><i></i></native-probe>
    <template au-slot="first"><native-probe data-native="flat-projection"><i></i></native-probe></template>
    <projection-probe id="projected-first" au-slot="first"><span au-slot="authored" class="projected-value">first:${message}</span><template><i></i></template></projection-probe>
    <projection-probe id="projected-second" au-slot="second"><span au-slot="authored" class="projected-value">second:${message}</span><template><i></i></template></projection-probe>
    <template au-slot="first"><projection-probe id="projected-flat"><span au-slot="authored" class="projected-value">flat:${message}</span><template><i></i></template></projection-probe></template>
    <template au-slot="second" repeat.for="item of items" if.bind="active && item !== 'two'"><projection-probe class="projected-repeat"><span au-slot="authored" class="projected-value">${item}:${message}</span><template><i></i></template></projection-probe></template>
  </projection-lab>
  <section id="document-transitions">
    <projection-probe id="tc-own" if.bind="active"><span au-slot="authored" class="projected-value">tc-own:${message}</span><template><i></i></template></projection-probe>
    <div id="tc-parent" if.bind="active"><projection-probe id="tc-descendant"><span au-slot="authored" class="projected-value">tc-descendant:${message}</span><template><i></i></template></projection-probe></div>
    <template if.bind="active"><projection-probe id="retained-tc-descendant"><span au-slot="authored" class="projected-value">retained-tc-descendant:${message}</span><template><i></i></template></projection-probe></template>
  </section>
</template>
