<template>
  <h1>${$this.title}</h1>
  <p>${$this.titleLength()}</p>
  <p>${title & oneTime}</p>

  <section if.bind="title.length > 0">
    <p>${title.toUpperCase()}</p>
  </section>
  <section else>
    <p>${title.toLowerCase()}</p>
  </section>

  <section with.bind="selectedItem">
    <button type="button" click.trigger="$parent.selectById(id)">${label}</button>
  </section>

  <ul>
    <li repeat.for="item of items">
      <span>${$index}: ${item.label}</span>
      <span>${$parent.title}</span>
      <span>${$parent.titleLength()}</span>
      <span>${$this.item.label}</span>
      <let row-title.bind="item.label" upper-row-title.bind="rowTitle.toUpperCase()" to-binding-context></let>
      <let rolling-row.bind="item"></let>
      <let rolling-row.bind="item.label"></let>
      <span>${upperRowTitle}</span>
      <span>${rollingRow.toUpperCase()}</span>
      <ul>
        <li repeat.for="child of item.children">
          <span>${child.label}</span>
          <span>${$parent.item.labelLength()}</span>
          <span>${$parent.item.label}</span>
          <span>${$parent.rowTitle}</span>
          <span>${$parent.upperRowTitle}</span>
          <span>${$parent.rollingRow.toUpperCase()}</span>
          <span>${$parent.$index.toFixed()}</span>
          <span>${$parent.$parent.title}</span>
          <span>${this.title}</span>
        </li>
      </ul>
    </li>
  </ul>

  <dl>
    <template repeat.for="[key, entry] of itemEntries">
      <dt>${$this.key}</dt>
      <dd>${$this.entry.label}</dd>
    </template>
  </dl>

  <let title.bind="title.length"></let>
  <span>${$this.title.toFixed()}</span>
  <span>${acceptApp($this)}</span>
  <ul>
    <li repeat.for="shadowItem of items">
      <span>${$parent.title.toFixed()}</span>
      <span>${$parent.acceptApp($parent)}</span>
    </li>
  </ul>
</template>
