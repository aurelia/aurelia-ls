name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI is currently scoped to IDE semantic assurance, bounded host support, and MCP release confidence.
  # Legacy compiler/SSR/SSG/Vite/playground lanes are parked until they target semantic-runtime.
  semantic-runtime:
    name: IDE Semantic Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules
        run: |
          git submodule status --recursive
          test -f aurelia/package.json
          test -f aurelia2-plugins/packages/aurelia2-table/package.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_APPROVE_BUILDS: esbuild

      - name: Bootstrap linked Aurelia dependencies
        run: pnpm bootstrap:aurelia

      - name: Check aggregate IDE assurance
        run: pnpm test:ide:assurance

  mcp-release:
    name: MCP Release Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules
        run: |
          git submodule status --recursive
          test -f aurelia/package.json
          test -f aurelia2-plugins/packages/aurelia2-table/package.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_APPROVE_BUILDS: esbuild

      - name: Bootstrap linked Aurelia dependencies
        run: pnpm bootstrap:aurelia

      - name: Smoke Atlas source maps
        run: pnpm --filter @aurelia-ls/atlas smoke

      - name: Probe source stdio MCP
        run: pnpm --filter @aurelia-ls/mcp probe:stdio

      - name: Check MCP release contracts
        run: pnpm --filter @aurelia-ls/mcp contract:release

      - name: Pack MCP release tarball
        run: pnpm --filter @aurelia-ls/mcp release:pack

      - name: Probe release tarball
        run: pnpm --filter @aurelia-ls/mcp probe:release-tarball

      - name: Probe project-local install
        run: pnpm --filter @aurelia-ls/mcp probe:project-local-install

      - name: Upload MCP release tarball
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-ls-mcp-release
          path: packages/mcp/.release/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  ide-support:
    name: IDE Support Contracts (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules
        shell: bash
        run: |
          git submodule status --recursive
          test -f aurelia/package.json
          test -f aurelia2-plugins/packages/aurelia2-table/package.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_APPROVE_BUILDS: esbuild

      - name: Bootstrap linked Aurelia dependencies
        run: pnpm bootstrap:aurelia

      - name: Check bounded IDE support contracts
        run: pnpm test:ide:support

  vscode-extension-host:
    name: VS Code Extension Host Support (Windows)
    runs-on: windows-latest
    needs: ide-support
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules
        shell: bash
        run: |
          git submodule status --recursive
          test -f aurelia/package.json
          test -f aurelia2-plugins/packages/aurelia2-table/package.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_APPROVE_BUILDS: esbuild

      - name: Bootstrap linked Aurelia dependencies
        run: pnpm bootstrap:aurelia

      - name: Test release VS Code Worker hosts
        run: pnpm test:vscode:extension-host:release
