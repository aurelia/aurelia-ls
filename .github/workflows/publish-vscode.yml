name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified VSIX to the VS Code Marketplace
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Package the exact VSIX candidate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      head: ${{ steps.release.outputs.head }}
      short_head: ${{ steps.release.outputs.short_head }}
      vsix_name: ${{ steps.release.outputs.vsix_name }}
      receipt_name: ${{ steps.release.outputs.receipt_name }}
      checksum_name: ${{ steps.release.outputs.checksum_name }}
      candidate_artifact_name: ${{ steps.release.outputs.candidate_artifact_name }}
      evidence_artifact_name: ${{ steps.release.outputs.evidence_artifact_name }}
      candidate_artifact_id: ${{ steps.candidate_packet.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.candidate_packet.outputs.artifact-digest }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      ci_run_url: ${{ steps.ci.outputs.ci_run_url }}
    defaults:
      run:
        shell: pwsh
        working-directory: .

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm 11.5.2
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate the committed release identity
        id: release
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -LiteralPath 'packages/vscode/package.json' -Raw | ConvertFrom-Json
          if ($package.name -ne 'aurelia-2') {
            throw "Unexpected extension package name: $($package.name)"
          }
          $version = [string]$package.version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Extension version is not a supported committed semver: $version"
          }

          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve one full lowercase Git commit.'
          }
          if ($head -ne $env:GITHUB_SHA) {
            throw "Checked-out HEAD $head does not match GITHUB_SHA $env:GITHUB_SHA."
          }
          $status = git status --porcelain=v1 --untracked-files=all --ignore-submodules=none
          if ($LASTEXITCODE -ne 0 -or $status) {
            throw "Release checkout is not clean:`n$($status -join "`n")"
          }

          $releaseTag = "refs/tags/vscode-v$version"
          if ($env:PUBLISH_REQUESTED -eq 'true') {
            if ($env:GITHUB_REF -ne $releaseTag) {
              throw "Marketplace publication requires workflow dispatch from $releaseTag; received $env:GITHUB_REF."
            }
            $tagCommitOutput = git rev-parse "$releaseTag^{commit}"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to resolve release tag $releaseTag to a commit."
            }
            $tagCommit = ([string]$tagCommitOutput).Trim()
            if ($tagCommit -notmatch '^[0-9a-f]{40}$') {
              throw "Release tag $releaseTag did not resolve to one full lowercase Git commit: $tagCommit"
            }
            if ($tagCommit -ne $head) {
              throw "Release tag $releaseTag resolves to $tagCommit instead of checked-out HEAD $head."
            }
          }

          $shortHead = $head.Substring(0, 12)
          $stem = "aurelia-2-$version-$shortHead"
          $outputs = [ordered]@{
            version = $version
            head = $head
            short_head = $shortHead
            vsix_name = "$stem.vsix"
            receipt_name = "$stem.manifest.json"
            checksum_name = "$stem.sha256"
            candidate_artifact_name = "$stem-candidate"
            evidence_artifact_name = "$stem-release-evidence"
            vsix_path = Join-Path $env:GITHUB_WORKSPACE "packages/vscode/.release/$stem.vsix"
            receipt_path = Join-Path $env:GITHUB_WORKSPACE "packages/vscode/.release/$stem.manifest.json"
            checksum_path = Join-Path $env:GITHUB_WORKSPACE "packages/vscode/.release/$stem.sha256"
          }
          foreach ($entry in $outputs.GetEnumerator()) {
            $value = ([string]$entry.Value).Replace('\', '/')
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$($entry.Key)=$value"
          }

      - name: Require successful full CI for the release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runs = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:GITHUB_SHA --event push --status success --limit 100 --json databaseId,headSha,headBranch,event,status,conclusion,url | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to query CI runs for the release commit.'
          }
          $accepted = @($runs | Where-Object {
            $_.headSha -eq $env:GITHUB_SHA `
              -and $_.headBranch -eq 'main' `
              -and $_.event -eq 'push' `
              -and $_.status -eq 'completed' `
              -and $_.conclusion -eq 'success'
          } | Sort-Object databaseId -Descending)
          if ($accepted.Count -eq 0) {
            throw "No successful full CI push run exists on main for $env:GITHUB_SHA."
          }
          $selected = $accepted[0]
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ci_run_id=$($selected.databaseId)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ci_run_url=$($selected.url)"
          Write-Host "Accepted full CI run $($selected.databaseId): $($selected.url)"

      - name: Verify exact submodules
        run: |
          $ErrorActionPreference = 'Stop'
          $rows = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect recursive submodules.'
          }
          $invalid = @($rows | Where-Object { $_ -notmatch '^ ' })
          if ($invalid.Count -ne 0) {
            throw "Submodules are not initialized at exact commits:`n$($invalid -join "`n")"
          }
          foreach ($required in @(
            'aurelia/package.json',
            'aurelia2-plugins/packages/aurelia2-table/package.json'
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required submodule file is missing: $required"
            }
          }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_APPROVE_BUILDS: esbuild

      - name: Bootstrap linked Aurelia dependencies
        run: pnpm bootstrap:aurelia

      - name: Verify pinned release tools
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = (node --version).Trim()
          $pnpmVersion = (pnpm --version).Trim()
          $vsceVersion = (pnpm --filter aurelia-2 exec vsce --version).Trim()
          if ($nodeVersion -ne 'v22.19.0') { throw "Expected Node v22.19.0; received $nodeVersion." }
          if ($pnpmVersion -ne '11.5.2') { throw "Expected pnpm 11.5.2; received $pnpmVersion." }
          if ($vsceVersion -ne '3.9.2') { throw "Expected VSCE 3.9.2; received $vsceVersion." }

      - name: Recheck exact clean release tree
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne '${{ steps.release.outputs.head }}') {
            throw "Pre-package HEAD $head does not match admitted release commit ${{ steps.release.outputs.head }}."
          }
          $status = @(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to recheck the complete pre-package worktree state.'
          }
          if ($status.Count -ne 0) {
            throw "Pre-package worktree is not clean:`n$($status -join "`n")"
          }
          $submodules = @(git submodule status --recursive)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to recheck recursive submodule state.'
          }
          $invalidSubmodules = @($submodules | Where-Object { $_ -notmatch '^ ' })
          if ($invalidSubmodules.Count -ne 0) {
            throw "Pre-package submodules are not at exact admitted commits:`n$($invalidSubmodules -join "`n")"
          }

      - name: Package the extension exactly once
        run: pnpm package:ide:vsix

      - name: Verify the packaged VSIX
        run: pnpm verify:ide:vsix

      - name: Require the exact candidate packet
        env:
          VSIX_PATH: ${{ steps.release.outputs.vsix_path }}
          RECEIPT_PATH: ${{ steps.release.outputs.receipt_path }}
          CHECKSUM_PATH: ${{ steps.release.outputs.checksum_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($entry in @(
            @{ Label = 'VSIX'; Path = $env:VSIX_PATH },
            @{ Label = 'receipt'; Path = $env:RECEIPT_PATH },
            @{ Label = 'checksum'; Path = $env:CHECKSUM_PATH }
          )) {
            if (-not (Test-Path -LiteralPath $entry.Path -PathType Leaf)) {
              throw "Exact $($entry.Label) is missing: $($entry.Path)"
            }
            if ((Get-Item -LiteralPath $entry.Path -Force).Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) {
              throw "Exact $($entry.Label) must not be a reparse point: $($entry.Path)"
            }
          }

      - name: Upload the exact candidate packet
        id: candidate_packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.candidate_artifact_name }}
          path: |
            ${{ steps.release.outputs.vsix_path }}
            ${{ steps.release.outputs.receipt_path }}
            ${{ steps.release.outputs.checksum_path }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  host:
    name: Accept exact VSIX (Windows, ${{ matrix.label }})
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: current-stable
            label: current stable
          - lane: minimum
            label: minimum 1.91
    defaults:
      run:
        shell: pwsh
        working-directory: .

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm 11.5.2
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact submodules
        shell: bash
        run: |
          git submodule status --recursive
          test -f aurelia/package.json
          test -f aurelia2-plugins/packages/aurelia2-table/package.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_APPROVE_BUILDS: esbuild

      - name: Bootstrap linked Aurelia dependencies
        run: pnpm bootstrap:aurelia

      - name: Build exact VSIX verification inputs
        run: |
          pnpm build:ide:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter aurelia-2 run bundle:minify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the exact candidate packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_artifact_id }}
          path: packages/vscode/.release
          merge-multiple: true

      - name: Require only the exact downloaded packet
        env:
          VSIX_NAME: ${{ needs.candidate.outputs.vsix_name }}
          RECEIPT_NAME: ${{ needs.candidate.outputs.receipt_name }}
          CHECKSUM_NAME: ${{ needs.candidate.outputs.checksum_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'packages/vscode/.release'
          $expected = @($env:VSIX_NAME, $env:RECEIPT_NAME, $env:CHECKSUM_NAME) | Sort-Object
          $entries = @(Get-ChildItem -LiteralPath $releaseRoot -Force)
          $actual = @($entries | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Downloaded release packet differs from the exact candidate set: $($actual -join ', ')"
          }
          foreach ($entry in $entries) {
            if (-not $entry.PSIsContainer -and -not $entry.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) {
              continue
            }
            throw "Downloaded release packet contains a directory or reparse point: $($entry.FullName)"
          }

      - name: Verify the downloaded VSIX
        run: pnpm verify:ide:vsix

      - name: Test the exact installed VSIX on ${{ matrix.label }}
        run: pnpm --filter aurelia-2 run test:extension-host:installed:${{ matrix.lane }}:built

      - name: Re-verify the accepted VSIX
        run: pnpm verify:ide:vsix

      - name: Recheck release source state
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ needs.candidate.outputs.head }}') {
            throw 'Host acceptance changed or checked out the wrong release commit.'
          }
          $status = @(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
            throw "Host acceptance changed the tracked release tree:`n$($status -join "`n")"
          }

  release:
    name: Attest and publish the accepted VSIX
    needs: [candidate, host]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
        working-directory: .

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm 11.5.2
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact submodules
        shell: bash
        run: |
          git submodule status --recursive
          test -f aurelia/package.json
          test -f aurelia2-plugins/packages/aurelia2-table/package.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_APPROVE_BUILDS: esbuild

      - name: Bootstrap linked Aurelia dependencies
        run: pnpm bootstrap:aurelia

      - name: Verify pinned release tools
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node --version).Trim() -ne 'v22.19.0') { throw 'Node version drifted.' }
          if ((pnpm --version).Trim() -ne '11.5.2') { throw 'pnpm version drifted.' }
          if ((pnpm --filter aurelia-2 exec vsce --version).Trim() -ne '3.9.2') { throw 'VSCE version drifted.' }

      - name: Build exact VSIX verification inputs
        run: |
          pnpm build:ide:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter aurelia-2 run bundle:minify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the accepted candidate packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_artifact_id }}
          path: packages/vscode/.release
          merge-multiple: true

      - name: Require only the exact accepted packet
        env:
          VSIX_NAME: ${{ needs.candidate.outputs.vsix_name }}
          RECEIPT_NAME: ${{ needs.candidate.outputs.receipt_name }}
          CHECKSUM_NAME: ${{ needs.candidate.outputs.checksum_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'packages/vscode/.release'
          $expected = @($env:VSIX_NAME, $env:RECEIPT_NAME, $env:CHECKSUM_NAME) | Sort-Object
          $entries = @(Get-ChildItem -LiteralPath $releaseRoot -Force)
          $actual = @($entries | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw "Accepted release packet differs from the exact candidate set: $($actual -join ', ')"
          }
          foreach ($entry in $entries) {
            if (-not $entry.PSIsContainer -and -not $entry.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) {
              continue
            }
            throw "Accepted release packet contains a directory or reparse point: $($entry.FullName)"
          }

      - name: Verify the accepted VSIX
        run: pnpm verify:ide:vsix

      - name: Install and accept the exact VSIX
        id: installed
        run: pnpm verify:ide:vsix:installed

      - name: Resolve retained installed evidence
        id: evidence
        if: ${{ always() }}
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.installed.outcome }}
          INSTALLED_EVIDENCE_PATH: ${{ github.workspace }}/.temp/vscode-vsix-installed/${{ needs.candidate.outputs.short_head }}/installed.evidence.json
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:INSTALLED_EVIDENCE_PATH -PathType Leaf)) {
            if ($env:ACCEPTANCE_OUTCOME -eq 'success') {
              throw "Installed acceptance succeeded without its immutable evidence: $env:INSTALLED_EVIDENCE_PATH"
            }
            Write-Warning 'Installed evidence was not allocated before the earlier failure.'
            exit 0
          }

          $evidence = Get-Content -LiteralPath $env:INSTALLED_EVIDENCE_PATH -Raw | ConvertFrom-Json
          if ($env:ACCEPTANCE_OUTCOME -eq 'success' -and $evidence.status -ne 'passed') {
            throw "Installed acceptance succeeded but evidence status is $($evidence.status)."
          }
          $retainedLogs = [ordered]@{
            client_log_path = $evidence.logs.client.evidence.path
            extension_host_log_path = $evidence.logs.extensionHost.evidence.path
          }
          foreach ($entry in $retainedLogs.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$entry.Value)) { continue }
            $absolute = Join-Path $env:GITHUB_WORKSPACE ([string]$entry.Value)
            if (-not (Test-Path -LiteralPath $absolute -PathType Leaf)) {
              throw "Retained evidence path is missing: $absolute"
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$($entry.Key)=$($absolute.Replace('\', '/'))"
          }

      - name: Re-verify the installed artifact bytes
        run: pnpm verify:ide:vsix

      - name: Attest the exact VSIX provenance
        id: provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: packages/vscode/.release/${{ needs.candidate.outputs.vsix_name }}

      - name: Publish the exact accepted VSIX
        if: ${{ inputs.publish }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_PATH: ${{ github.workspace }}/packages/vscode/.release/${{ needs.candidate.outputs.vsix_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VSCE_PAT)) {
            throw 'VSCE_PAT is required for an opted-in Marketplace publication.'
          }
          pnpm --filter aurelia-2 exec vsce publish --packagePath "$env:VSIX_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Final verification of the published-or-ready bytes
        run: pnpm verify:ide:vsix

      - name: Upload the exact release packet and acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.candidate.outputs.evidence_artifact_name }}
          path: |
            packages/vscode/.release/${{ needs.candidate.outputs.vsix_name }}
            packages/vscode/.release/${{ needs.candidate.outputs.receipt_name }}
            packages/vscode/.release/${{ needs.candidate.outputs.checksum_name }}
            .temp/vscode-vsix-installed/${{ needs.candidate.outputs.short_head }}/installed.evidence.json
            .temp/vscode-vsix-installed/${{ needs.candidate.outputs.short_head }}/driver.report.json
            .temp/vscode-vsix-installed/${{ needs.candidate.outputs.short_head }}/install.stdout.txt
            .temp/vscode-vsix-installed/${{ needs.candidate.outputs.short_head }}/install.stderr.txt
            .temp/vscode-vsix-installed/${{ needs.candidate.outputs.short_head }}/host.stdout.txt
            .temp/vscode-vsix-installed/${{ needs.candidate.outputs.short_head }}/host.stderr.txt
            ${{ steps.evidence.outputs.client_log_path }}
            ${{ steps.evidence.outputs.extension_host_log_path }}
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
